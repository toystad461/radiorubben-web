name: Prepare requested player example draft
on:
  push:
    branches: ['feat/fotballrobot-player-monitor']
    paths: ['.github/workflows/fotballrobot-player-example.yml']
permissions:
  contents: read
concurrency:
  group: radiorubben-wordpress
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/feat/fotballrobot-player-monitor'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate the one-time example action
        run: |
          php -l scripts/fotballrobot-player-example.php
          git diff --check
      - name: Configure existing deployment access
        env:
          DEPLOY_KEY: ${{ secrets.WP_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.WP_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$DEPLOY_KEY"; test -n "$KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host *\n  BatchMode yes\n  StrictHostKeyChecking yes\n  IdentitiesOnly yes\n  ConnectTimeout 15\n' > ~/.ssh/config
      - name: Create one protected test draft through the native review workflow
        run: |
          set -euo pipefail
          host=cptk37ymg_w1417156@ssh.cptk37ymg.service.one
          stage=".radiorubben-deploy/candidates/$GITHUB_SHA"
          ssh "$host" "mkdir -p $stage/scripts"
          rsync -rltz scripts/fotballrobot-player-example.php "$host:$stage/scripts/"
          ssh "$host" "/usr/local/bin/wp --path=/run/webroots/r1417157 --skip-themes --user=1 eval-file $stage/scripts/fotballrobot-player-example.php"
      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
