name: News priority — template and screen checks
on:
  pull_request:
    paths: ['theme-next/**', '.github/workflows/news-priority.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: PHP syntax and isolated contracts
        run: |
          php -l theme-next/radio-rubben-next/front-page.php
          php -l theme-next/radio-rubben-next/template-parts/home/news-priority.php
          php theme-next/tests/news-priority.php
          python3 theme-next/scripts/check.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Test narrow screens and enlarged text without external requests
        run: python theme-next/tests/news-priority-screen.py
        env:
          RR_NEWS_SCREEN_DIR: ${{ runner.temp }}/news-priority
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: news-priority-screen
          path: ${{ runner.temp }}/news-priority/
          if-no-files-found: warn
