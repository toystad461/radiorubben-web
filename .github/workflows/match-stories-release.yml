name: Read-only verification of deployed Sport release
on:
  push:
    branches: ['release/match-stories-sport-20261024']
permissions:
  contents: read
concurrency:
  group: sport-release-production
  cancel-in-progress: false
jobs:
  verify:
    if: github.run_attempt == 1 && contains(github.event.head_commit.message, '[sport-final-readcheck-20261024]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Build hash-bound read-only checker
        run: |
          set -euo pipefail
          python3 scripts/match-stories-release/prepare-theme.py "$RUNNER_TEMP/sport-release"
          php -l "$RUNNER_TEMP/sport-release/scripts/preflight.php"
      - name: Read all 49 production after-hashes with existing SSH mechanism
        env:
          DEPLOY_KEY: ${{ secrets.WP_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.WP_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$DEPLOY_KEY"; test -n "$KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host *\n  BatchMode yes\n  StrictHostKeyChecking yes\n  IdentitiesOnly yes\n  ConnectTimeout 15\n' > ~/.ssh/config
          ssh cptk37ymg_w1417156@ssh.cptk37ymg.service.one php -- after < "$RUNNER_TEMP/sport-release/scripts/preflight.php" > "$RUNNER_TEMP/aftercheck.json"
          cat "$RUNNER_TEMP/aftercheck.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: sport-release-final-readcheck
          path: |
            ${{ runner.temp }}/aftercheck.json
            ${{ runner.temp }}/sport-release/manifest.json
          retention-days: 30
      - name: Remove runner key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
