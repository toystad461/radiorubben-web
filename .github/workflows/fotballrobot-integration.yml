name: Fotballrobot integration checks
on:
  push:
    branches: ['integrate/fotballrobot-090-quality', 'feat/newsroom-digest', 'fix/player-story-image']
    paths: ['wordpress/wp-content/plugins/radio-rubben-fotballrobot/**', '.github/workflows/fotballrobot-integration.yml']
  pull_request:
    paths: ['wordpress/wp-content/plugins/radio-rubben-fotballrobot/**', '.github/workflows/fotballrobot-integration.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: PHP lint and isolated tests
        run: |
          set -euo pipefail
          root=wordpress/wp-content/plugins/radio-rubben-fotballrobot
          find "$root" -name '*.php' -print0 | xargs -0 -n1 php -l
          for test in run lineups writer writer-flow inline-sources editorial-quality staged-quality publication-gate player-review player-corrections review-desk review-digest newsroom player-news-filter players candidates-media learning report bootstrap match-jobs; do
            php "$root/tests/$test.php"
          done
          git diff --check
      - name: Mobile reading and approval states
        env:
          RRFR_RENDER_DIR: ${{ runner.temp }}/rrfr-render
          RRFR_PLAYWRIGHT: ${{ runner.temp }}/rrfr-ui/node_modules/playwright
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          set -euo pipefail
          php wordpress/wp-content/plugins/radio-rubben-fotballrobot/tests/review-desk.php
          npm install --prefix "$RUNNER_TEMP/rrfr-ui" --no-audit --no-fund playwright@1.62.1
          node scripts/review-desk-visual.cjs

