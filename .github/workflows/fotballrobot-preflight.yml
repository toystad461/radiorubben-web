name: Fotballrobot candidate WordPress test
on:
  push:
    branches: ['integrate/fotballrobot-090-quality']
    paths: ['.github/workflows/fotballrobot-preflight.yml']
permissions:
  contents: read
concurrency:
  group: radiorubben-fotballrobot-candidate
  cancel-in-progress: false
jobs:
  test:
    if: github.ref == 'refs/heads/integrate/fotballrobot-090-quality'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate candidate before server test
        run: |
          set -euo pipefail
          root=wordpress/wp-content/plugins/radio-rubben-fotballrobot
          find "$root" -name '*.php' -print0 | xargs -0 -n1 php -l
          for test in run writer writer-flow editorial-quality staged-quality publication-gate player-review players learning report bootstrap match-jobs; do php "$root/tests/$test.php"; done
          php -l scripts/fotballrobot-preflight.php
      - name: Configure existing deployment access
        env:
          DEPLOY_KEY: ${{ secrets.WP_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.WP_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$DEPLOY_KEY"; test -n "$KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host *\n  BatchMode yes\n  StrictHostKeyChecking yes\n  IdentitiesOnly yes\n  ConnectTimeout 15\n' > ~/.ssh/config
      - name: Stage candidate outside webroot and test one unpublished draft
        run: |
          set -euo pipefail
          host=cptk37ymg_w1417156@ssh.cptk37ymg.service.one
          stage=".radiorubben-deploy/candidates/$GITHUB_SHA"
          ssh "$host" "umask 077; mkdir -p $stage/wordpress/wp-content/plugins/radio-rubben-fotballrobot $stage/scripts"
          rsync -rltz wordpress/wp-content/plugins/radio-rubben-fotballrobot/ "$host:$stage/wordpress/wp-content/plugins/radio-rubben-fotballrobot/"
          rsync -rltz scripts/fotballrobot-preflight.php "$host:$stage/scripts/"
          ssh "$host" "/usr/local/bin/wp --path=/run/webroots/r1417157 --skip-plugins=radio-rubben-fotballrobot eval-file $stage/scripts/fotballrobot-preflight.php"
      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
