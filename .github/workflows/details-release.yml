name: Fotballrobot detail and learning checks
on:
  push:
    branches: ['codex/football-detail-learning']
    paths: ['scripts/*details*', '.github/workflows/details-release.yml', 'wordpress/wp-content/plugins/radio-rubben-fotballrobot/**']
permissions:
  contents: read
concurrency:
  group: radiorubben-wordpress
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test source dates, editorial gates and bounded installer
        run: |
          python3 scripts/test-fotballrobot.py
          python3 scripts/package-details.py "$RUNNER_TEMP/kickoff"
          php scripts/test-details-install.php
