name: Release PR30 youth reports and Sunday preview
on:
  push:
    branches: ['feature/bremnes-youth-weekly']
    paths: ['.github/workflows/pr30-release.yml']
permissions:
  contents: read
concurrency:
  group: radiorubben-wordpress
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Verified baseline, exact candidate and regression checks
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/rrfr-baseline"
          git archive 75326d1c26cd3b30f7c52ead8246b4e99df950a4 | tar -x -C "$RUNNER_TEMP/rrfr-baseline"
          python3 "$RUNNER_TEMP/rrfr-baseline/scripts/verify-fotballrobot-runtime.py"
          python3 "$RUNNER_TEMP/rrfr-baseline/scripts/test-fotballrobot-runtime.py"
          python3 scripts/verify-pr30-release.py
          python3 scripts/test-fotballrobot.py
          php -l scripts/pr30-install.php
          php -l scripts/pr30-postflight.php
          bash -n scripts/deploy-pr30.sh
          python3 scripts/test-pr30-install.py
          git diff --check 75326d1c26cd3b30f7c52ead8246b4e99df950a4 HEAD
  deploy:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Guarded selective deployment and activation
        env:
          DEPLOY_KEY: ${{ secrets.WP_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.WP_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$DEPLOY_KEY"
          test -n "$KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host *\n  BatchMode yes\n  StrictHostKeyChecking yes\n  IdentitiesOnly yes\n  ConnectTimeout 15\n' > ~/.ssh/config
          host=cptk37ymg_w1417156@ssh.cptk37ymg.service.one
          stage=".radiorubben-deploy/pr30/$GITHUB_SHA"
          mkdir -p release/scripts
          cp scripts/pr30-{install,postflight}.php scripts/pr30-release.json scripts/deploy-pr30.sh release/scripts/
          php -r '$m=json_decode(file_get_contents("scripts/pr30-release.json"),true);foreach($m["changed"]as$p=>$h){@mkdir(dirname("release/runtime/".$p),0700,true);copy("wordpress/".$p,"release/runtime/".$p);}'
          ssh "$host" "umask 077; mkdir -p $stage"
          rsync -rltz release/ "$host:$stage/"
          ssh "$host" "bash $stage/scripts/deploy-pr30.sh $GITHUB_SHA"
      - name: Remove runner key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
