name: Fotballrobot kickoff correction checks
on:
  push:
    branches: ['codex/football-kickoff-time']
    paths: ['scripts/*kickoff*', '.github/workflows/kickoff-release.yml', 'wordpress/wp-content/plugins/radio-rubben-fotballrobot/**']
permissions:
  contents: read
concurrency:
  group: radiorubben-wordpress
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test source dates, editorial gates and bounded installer
        run: |
          python3 scripts/test-fotballrobot.py
          python3 scripts/package-kickoff.py "$RUNNER_TEMP/kickoff"
          php scripts/test-kickoff-install.php
          bash -n scripts/deploy-kickoff.sh
      - name: Check production hashes for the two-file correction
        env:
          DEPLOY_KEY: ${{ secrets.WP_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.WP_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$DEPLOY_KEY"
          test -n "$KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host *\n  BatchMode yes\n  StrictHostKeyChecking yes\n  IdentitiesOnly yes\n  ConnectTimeout 15\n' > ~/.ssh/config
          host=cptk37ymg_w1417156@ssh.cptk37ymg.service.one
          stage=".radiorubben-deploy/kickoff/$GITHUB_SHA"
          ssh "$host" "umask 077; mkdir -p $stage"
          rsync -rltz "$RUNNER_TEMP/kickoff/" "$host:$stage/"
          ssh "$host" "bash $stage/scripts/deploy-kickoff.sh \$HOME/$stage \$HOME/.radiorubben-deploy/backups/kickoff-$GITHUB_SHA check"
      - name: Remove runner key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
