name: Fotballrobot learning package selective release
on:
  push:
    branches: ['codex/football-context-learning-20261022']
    paths: ['.github/workflows/context-learning-release.yml']
permissions:
  contents: read
concurrency:
  group: radiorubben-wordpress
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test exact candidate, drift rejection and rollback before production
        run: |
          set -euo pipefail
          python3 scripts/test-fotballrobot.py
          php -l scripts/learning-install.php
          php -l scripts/learning-postflight.php
          php scripts/test-learning-install.php
          bash -n scripts/deploy-learning.sh
          python3 scripts/package-learning.py "$RUNNER_TEMP/learning"
          git diff --check HEAD^ HEAD
      - name: Install only four approved files with private backup
        env:
          DEPLOY_KEY: ${{ secrets.WP_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.WP_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$DEPLOY_KEY"
          test -n "$KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host *\n  BatchMode yes\n  StrictHostKeyChecking yes\n  IdentitiesOnly yes\n  ConnectTimeout 15\n' > ~/.ssh/config
          host=cptk37ymg_w1417156@ssh.cptk37ymg.service.one
          stage=".radiorubben-deploy/learning/$GITHUB_SHA"
          ssh "$host" "umask 077; mkdir -p $stage"
          rsync -rltz "$RUNNER_TEMP/learning/" "$host:$stage/"
          ssh "$host" "bash $stage/scripts/deploy-learning.sh $GITHUB_SHA"
      - name: Remove runner key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
