name: Member login return - one-file release
on:
  push:
    branches: [codex/member-login-return-20261008]
    paths: ['.github/workflows/member-login-return-release.yml', 'scripts/member-login-return-release.sh', 'scripts/test_member_login_return_release.py']
permissions:
  contents: read
  actions: read
concurrency:
  group: radiorubben-wordpress
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: wordpress-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify tested source and exercise rollback offline
        env:
          DEPLOY_ENABLED: ${{ vars.WP_DEPLOY_ENABLED }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = refs/heads/codex/member-login-return-20261008
          test "$DEPLOY_ENABLED" = true
          git diff --exit-code 47de32dc6c329d1a50a4b423ee4626fba6c6e8c2 -- theme-next
          gh api 'repos/toystad461/radiorubben-web/actions/runs?head_sha=47de32dc6c329d1a50a4b423ee4626fba6c6e8c2&per_page=100' > /tmp/source-runs.json
          python3 - <<'PY'
          import json
          runs=json.load(open('/tmp/source-runs.json'))['workflow_runs']
          expected={37776937245,37776937270,37776937168,37776937278,37776937289}
          green={r['id'] for r in runs if r['status']=='completed' and r['conclusion']=='success'}
          assert expected <= green, 'Required source checks are not green'
          print('Five exact source checks verified')
          PY
          bash -n scripts/member-login-return-release.sh
          python3 scripts/test_member_login_return_release.py
          python3 theme-next/scripts/check.py
          php theme-next/tests/member-login-return.php
      - name: Configure existing verified deployment connection
        env:
          DEPLOY_KEY: ${{ secrets.WP_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.WP_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$DEPLOY_KEY" && test -n "$KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          printf 'Host *\n  BatchMode yes\n  StrictHostKeyChecking yes\n  IdentitiesOnly yes\n  ConnectTimeout 15\n' > ~/.ssh/config
      - name: Publish one exact plugin file with fresh baseline and verified backup
        run: |
          set -Eeuo pipefail
          release="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          bundle=$(mktemp -d)
          paths=(inc/quiz-controls.php)
          existing=(inc/quiz-controls.php)
          for path in "${paths[@]}"; do install -D -m 644 "theme-next/rr-site-functions/$path" "$bundle/new/$path"; done
          for path in "${existing[@]}"; do
            mkdir -p "$bundle/baseline/$(dirname "$path")"
            git show "2b4779dd778faf8b02913f75fdfacf2523e81a15:theme-next/rr-site-functions/$path" > "$bundle/baseline/$path"
          done
          (cd "$bundle/new"; sha256sum "${paths[@]}") > "$bundle/SHA256SUMS"
          host=cptk37ymg_w1417156@ssh.cptk37ymg.service.one
          ssh "$host" "set -e; umask 077; test ! -L .radiorubben-deploy; test ! -L .radiorubben-deploy/staging; mkdir -p .radiorubben-deploy/staging; mkdir .radiorubben-deploy/staging/member-login-return-$release"
          rsync -rlt --chmod=D700,F600 "$bundle/" "$host:.radiorubben-deploy/staging/member-login-return-$release/"
          ssh "$host" bash -s -- "$release" < scripts/member-login-return-release.sh
      - name: Remove runner SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
