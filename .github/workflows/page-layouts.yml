name: Radio Rubben — gjenbrukbare sidemaler
on:
  pull_request:
    paths: ['theme-next/**', '.github/workflows/page-layouts.yml']
  push:
    branches: ['design/reusable-page-templates']
    paths: ['theme-next/**', '.github/workflows/page-layouts.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Kildekontroll og eksisterende regresjoner
        run: |
          python3 theme-next/scripts/check.py
          php theme-next/tests/home-universes.php
          python3 -m unittest discover -s theme-next/tests -p 'test_read_only_probes.py'
          npm test
          npm run build
      - name: Hent WordPress 6.6.2-parser og versjonert theme.json-skjema
        run: |
          curl --fail --silent --show-error --location https://wordpress.org/wordpress-6.6.2.tar.gz -o /tmp/wordpress.tar.gz
          tar -xzf /tmp/wordpress.tar.gz -C /tmp
          curl --fail --silent --show-error https://schemas.wp.org/wp/6.6/theme.json -o /tmp/theme-schema.json
          python3 -m pip install --quiet jsonschema==4.23.0
          python3 -c 'import json,jsonschema; jsonschema.validate(json.load(open("theme-next/radio-rubben-next/theme.json")),json.load(open("/tmp/theme-schema.json")))'
      - name: Kontroller innholdsgrenser og render malene
        env:
          RR_WP_INCLUDES: /tmp/wordpress/wp-includes
        run: |
          php theme-next/tests/page-layouts.php
          for layout in standard application editorial football; do
            RR_LAYOUT="$layout" php theme-next/tests/page-preview.php > "page-preview-$layout.html"
          done
      - name: Mobil, tastatur, lenker, lesebredde og profil
        run: |
          npm install --prefix /tmp/rr-page-browser --no-save --package-lock=false playwright@1.62.1
          /tmp/rr-page-browser/node_modules/.bin/playwright install --with-deps chromium
          python3 -m http.server 12380 --bind 127.0.0.1 > /tmp/rr-page-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          NODE_PATH=/tmp/rr-page-browser/node_modules node theme-next/tests/page-browser.cjs
      - name: Bygg stagingpakker
        run: python3 theme-next/scripts/package.py
      - name: Lagre stagingpakker og layoutbevis
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: page-layouts-staging-${{ github.sha }}
          path: |
            theme-next/dist/
            theme-next/docs/page-preview/
            page-preview-*.html
          if-no-files-found: error
          retention-days: 14
