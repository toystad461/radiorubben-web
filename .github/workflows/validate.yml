name: Kontroller Radio Rubben

on:
  push:
    branches:
      - main
      - utvikling
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  kontroller:
    runs-on: ubuntu-latest
    steps:
      - name: Hent kildekoden
        uses: actions/checkout@v4
      - name: Sett opp Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Kjør automatiske kontroller
        run: npm test
      - name: Kontroller produksjonsbygg
        run: npm run build
